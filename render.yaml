services:
  - type: web
    name: vip-platform
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ARTIST_NAME
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: TICKETMASTER_API_KEY
        sync: false
      - key: BANDSINTOWN_APP_ID
        sync: false
      - key: RENDER_DISK_PATH
        sync: false
# NOTE: Render free web services do NOT support persistent disks.
# Data is persisted in Turso (cloud SQLite) and email is sent via Resend (HTTPS API).
# Set TURSO_DATABASE_URL, TURSO_AUTH_TOKEN, RESEND_API_KEY, and RESEND_FROM_EMAIL
# in your Render dashboard under Environment variables.
