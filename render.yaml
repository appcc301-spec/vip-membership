services:
  - type: web
    name: vip-platform
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ARTIST_NAME
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: TICKETMASTER_API_KEY
        sync: false
      - key: BANDSINTOWN_APP_ID
        sync: false
      - key: RENDER_DISK_PATH
        sync: false
# NOTE: Render free web services do NOT support persistent disks. SQLite data and
# uploaded files will be lost on redeploy/restart. For free persistence, deploy to
# Fly.io instead (see fly.toml and Dockerfile in this repo).
